<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>STone — กำลังโหลด…</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <style>body{font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f9fafb;color:#111}
  .box{text-align:center;padding:1.5rem} .spin{animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
  <div class="box" id="bootBox">
    <div class="spin" style="font-size:2rem;display:inline-block">↻</div>
    <p>กำลังโหลดหน้าแอป STone…</p>
  </div>
  <script>
  (async function () {
    var SHELL_KEY = 'stone_shell_html_v3';
    var urls = [
      'https://cdn.jsdelivr.net/gh/uburiram/STone@ac6bd385a45f89e99996542626ac700f5bc80936/index.html',
      'https://raw.githubusercontent.com/uburiram/STone/ac6bd385a45f89e99996542626ac700f5bc80936/index.html'
    ];
    var html = null, err = null;
    try {
      var cached = sessionStorage.getItem(SHELL_KEY) || localStorage.getItem(SHELL_KEY);
      if (cached && cached.indexOf('dashboardInsight') >= 0 && cached.indexOf('firebase.js') >= 0) {
        html = cached;
      }
    } catch (e) {}
    if (!html) {
      for (var i = 0; i < urls.length; i++) {
        try {
          var r = await fetch(urls[i], { cache: 'no-store' });
          if (r.ok) {
            html = await r.text();
            if (html && html.indexOf('dashboardInsight') >= 0) {
              try {
                sessionStorage.setItem(SHELL_KEY, html);
                localStorage.setItem(SHELL_KEY, html);
              } catch (e2) {}
              break;
            }
            html = null;
          }
        } catch (e) { err = e; }
      }
    }
    if (!html) {
      var box = document.getElementById('bootBox') || document.body;
      box.innerHTML = '<div class="box"><p>โหลดไม่สำเร็จ</p><p style="font-size:12px;color:#666">กรุณาเชื่อมต่อเน็ตครั้งหนึ่งเพื่อแคชหน้าแอป แล้วเปิดใหม่</p><button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;border-radius:10px;border:0;background:#ea580c;color:#fff;font-weight:700">ลองใหม่</button></div>';
      return;
    }
    document.open();
    document.write(html);
    document.close();
    function inject(src) {
      try {
        var s = document.createElement('script');
        s.src = src;
        s.defer = true;
        (document.body || document.documentElement).appendChild(s);
      } catch (e) {}
    }
    var v = '202609031900';
    inject('./js/app-responsive-fit.js?v=' + v);
    inject('./js/app-autosync.js?v=' + v);
    inject('./js/app-layout-fix.js?v=' + v);
    inject('./js/app-dashboard-order.js?v=' + v);
    inject('./js/app-phase2-anchor-fix.js?v=' + v);
    setTimeout(function () {
      try {
        if (!window.db && !window.auth) {
          var s = document.createElement('script');
          s.type = 'module';
          s.src = './js/firebase.js?v=' + v;
          document.body.appendChild(s);
        }
      } catch (e) {}
    }, 2500);
  })();
  </script>
</body>
</html>
