<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy (basic hardening; allows required CDNs + inline handlers) -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline'
      https://cdnjs.cloudflare.com
      https://www.gstatic.com
      https://apis.google.com
      https://accounts.google.com
      https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline'
      https://cdnjs.cloudflare.com
      https://fonts.googleapis.com;
    font-src 'self' data:
      https://fonts.gstatic.com
      https://cdnjs.cloudflare.com
      https://cdn.jsdelivr.net;
    img-src 'self' data: blob: https:;
    connect-src 'self'
      https://*.googleapis.com
      https://*.google.com
      https://*.firebaseio.com
      https://*.firebaseapp.com
      https://*.firebasestorage.app
      https://identitytoolkit.googleapis.com
      https://securetoken.googleapis.com
      https://accounts.google.com
      https://apis.google.com
      https://cdn.jsdelivr.net
      https://cdnjs.cloudflare.com
      https://raw.githubusercontent.com
      https://github.com
      https://www.gstatic.com
      https://*.gstatic.com
;
    frame-src https://accounts.google.com https://*.google.com https://*.firebaseapp.com https://appleid.apple.com;
    worker-src 'self';
    manifest-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบบันทึกต้นทุน กำไร - STone</title>
